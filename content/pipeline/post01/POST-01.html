<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>POST-01 — debug-in-public — page de test AMK (render source)</title>
<style>
/* AMK POST-01 « bug logo » — page de test, rendu frame-par-frame via window.seek(t).
   Motion conforme AMK-DESIGN-SKILLS.md §9 : uniquement transform + opacity, easings maison,
   aucune entrée depuis scale(0), boucles en linear. Zéro référence client. Fichier muet. */
:root{
  --bg:#101814; --panel:#0B120E; --line:#23382E;
  --brand:#0E7A5C; --brand-bright:#12A87C;
  --ink:#FFFFFF; --soft:#C9D6CF; --code:#7FD8A6; --warn:#E8A13A;
  --disk:#1D2B25;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:540px;height:960px;overflow:hidden;background:var(--bg);
  font-family:Helvetica,Arial,"Liberation Sans",sans-serif;color:var(--ink)}
.stage{position:relative;width:540px;height:960px}

/* — chrome haut (statique) — */
.topbar{position:absolute;top:0;left:0;right:0;padding:34px 36px 0;display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:8px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.dots i:first-child{background:var(--brand)}
.eyebrow{font-size:20px;font-weight:700;letter-spacing:2.5px;color:var(--soft);text-transform:uppercase}

/* — overlay gras (change par beat) — */
.overlay{position:absolute;top:110px;left:36px;right:36px;font-size:52px;font-weight:800;
  line-height:1.12;letter-spacing:-.5px}
.overlay.small{font-size:40px}

/* — emblème AMK : anneau + monogramme + disque du bug — */
.emblem{position:absolute;top:280px;left:50%;width:300px;height:300px;margin-left:-150px}
.ring{position:absolute;inset:0;border-radius:50%;border:14px solid var(--brand);z-index:3}
.logo{position:absolute;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;
  transform-origin:50% 50%}
.logo svg{width:170px;height:170px}
.disk{position:absolute;inset:14px;border-radius:50%;background:var(--disk);z-index:2}
.disk-outline{position:absolute;inset:14px;border-radius:50%;z-index:4;
  border:4px dashed var(--warn);opacity:0}
.disk-label{position:absolute;top:406px;left:50%;width:280px;margin-left:-140px;text-align:center;
  font-size:20px;font-weight:700;color:var(--warn);letter-spacing:1px;opacity:0;z-index:5}

/* — panneau code (mock terminal) — */
.codewin{position:absolute;left:28px;right:28px;top:622px;height:204px;background:var(--panel);
  border:2px solid var(--line);border-radius:14px;padding:16px 20px;overflow:hidden}
.codewin .bar{display:flex;gap:7px;margin-bottom:12px}
.codewin .bar i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.code{font-family:"Liberation Mono","Courier New",monospace;font-size:21px;line-height:1.5;
  color:var(--code);white-space:pre}
.code .cm{color:var(--soft)}
.caret{display:inline-block;width:11px;height:22px;background:var(--code);vertical-align:-3px}

/* — caption narrative (bas) — */
.caption{position:absolute;left:36px;right:36px;bottom:42px;font-size:27px;line-height:1.35;
  color:var(--soft);font-weight:600}

/* — balayage scan (live debug) — */
.scan{position:absolute;left:0;right:0;top:0;height:150px;z-index:7;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(126,216,166,.13) 45%,rgba(255,255,255,.09) 55%,transparent)}

/* — barre de progression — */
.progress{position:absolute;left:0;right:0;bottom:0;height:12px;background:var(--line)}
.progress i{display:block;height:100%;background:var(--brand-bright);transform-origin:0 50%;
  transform:scaleX(0)}

</style>
</head>
<body>
<div class="stage">
  <div class="topbar"><div class="dots"><i></i><i></i><i></i></div>
    <div class="eyebrow">AMK · debug-in-public</div></div>

  <div class="overlay" id="overlay"></div>

  <div class="emblem" id="emblem">
    <div class="ring" id="ring"></div>
    <div class="disk" id="disk"></div>
    <div class="disk-outline" id="diskOutline"></div>
    <div class="logo" id="logo">
      <svg viewBox="60 100 80 100" aria-hidden="true">
        <line x1="100" y1="122" x2="74" y2="178" stroke="#fff" stroke-width="7"/>
        <line x1="100" y1="122" x2="126" y2="178" stroke="#fff" stroke-width="7"/>
        <line x1="74" y1="178" x2="126" y2="178" stroke="#fff" stroke-width="7"/>
        <circle cx="100" cy="122" r="6.5" fill="#fff"/>
        <circle cx="74" cy="178" r="6.5" fill="#fff"/>
        <circle cx="126" cy="178" r="6.5" fill="#fff"/>
      </svg>
    </div>
  </div>
  <div class="disk-label" id="diskLabel">disque PLEIN peint par-dessus</div>

  <div class="codewin">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="code" id="code"></div>
  </div>

  <div class="caption" id="caption"></div>
  <div class="scan" id="scan"></div>
  <div class="progress"><i id="prog"></i></div>
</div>

<script>
/* Déterministe : tout est fonction de t (secondes). window.seek(t) pose l'état exact.
   Easings maison (échantillonnage cubic-bezier) — §9 : out pour entrées/sorties,
   in-out pour le mouvement à l'écran, linear pour la boucle. */
function bez(p1x,p1y,p2x,p2y){return function(t){
  // Newton simplifié : suffisant pour nos durées
  let x=t;
  for(let i=0;i<6;i++){
    const cx=3*p1x*(1-x)*(1-x)*x+3*p2x*(1-x)*x*x+x*x*x - t;
    const dx=3*p1x*(1-2*x)*(1-x)+6*p2x*x*(1-x)-3*p2x*x*x+3*x*x + 1e-6;
    x-=cx/dx;
  }
  return 3*p1y*(1-x)*(1-x)*x+3*p2y*(1-x)*x*x+x*x*x;
};}
const easeOut=bez(.23,1,.32,1), easeInOut=bez(.77,0,.175,1);
const clamp01=v=>Math.max(0,Math.min(1,v));
const mix=(a,b,t)=>a+(b-a)*t;

/* Durées calées sur la VO voice-00 (mesurée) + respiration : VO démarre à s+0.15. */
const BEATS=[
 {s:0,    e:5.5,  ov:"Ce logo paraît normal.",            cap:"Ce logo, il paraît normal. Il nous a pris deux jours."},
 {s:5.5,  e:10.5, ov:"Jour 1 : le logo invisible.",       cap:"Au départ, le cercle était vide. Le logo ne s'affichait pas."},
 {s:10.5, e:16.5, ov:"Hypothèse 1 : le rognage. Faux.",   cap:"On enlève le masque : le logo revient. Donc ce n'était pas le rognage."},
 {s:16.5, e:25,   ov:"Hypothèse 2 : un disque peint par-dessus.", cap:"L'« anneau » était en fait un disque plein, peint au-dessus du logo."},
 {s:25,   e:33.5, ov:"Le fix : creuser l'anneau.",        cap:"On creuse l'anneau, le logo passe au-dessus. Résultat : propre."},
 {s:33.5, e:38.5, ov:"AMK — on construit, on casse, on comprend.", cap:"C'est ça, faire un site sérieux."}
];
const CODE_BAD=".logo-ring::before {\n  content: \"\"; inset: 0;\n  border-radius: 50%;\n  background: #1D2B25; /* disque PLEIN */\n}";
const CODE_FIX=".logo-ring {\n  border: 14px solid #0E7A5C;\n  background: transparent; }\n.logo { position: relative; z-index: 2; }";
const TOTAL=38.5;

const $=id=>document.getElementById(id);
let lastText=null;

function typeInto(el,text,t0,t1,t){
  const n=text.length;
  const k=clamp01((t-t0)/(t1-t0));
  const shown=text.slice(0,Math.round(n*k));
  if(shown!==lastText){el.textContent=shown;lastText=shown;}
  el.innerHTML=esc(shown)+(k<1?'<span class="caret"></span>':'');
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/(\/\*[^*]*\*\/)/g,'<span class="cm">$1</span>');}

function beatAt(t){for(const b of BEATS){if(t>=b.s&&t<b.e)return b;}return BEATS[BEATS.length-1];}

window.seek=function(t){
  t=Math.max(0,Math.min(TOTAL,t));
  const b=beatAt(t), local=t-b.s;

  /* — textes : entrée 420ms, ease-out, translateY(18px)→0 (§9 : jamais scale(0)) — */
  const kIn=easeOut(clamp01(local/0.42));
  const ov=$("overlay"), cap=$("caption");
  ov.textContent=b.ov; cap.textContent=b.cap;
  ov.classList.toggle('small', b.ov.length>36);
  ov.style.opacity=kIn; ov.style.transform=`translateY(${mix(18,0,kIn)}px)`;
  cap.style.opacity=kIn; cap.style.transform=`translateY(${mix(14,0,kIn)}px)`;

  /* — barre de progression + scan : linear (§9 : boucles/progression) — */
  $("prog").style.transform=`scaleX(${t/TOTAL})`;
  const SY=960+144;
  $("scan").style.transform=`translateY(${((t%2.5)/2.5)*SY-144}px)`;

  /* — états du cercle — */
  const disk=$("disk"), logo=$("logo"), dOut=$("diskOutline"), dLab=$("diskLabel");
  // beat1 (0-4) propre · beat2 (4-11) cassé : disque couvre le logo (fondu 520ms §dur-reveal)
  // beat3 (11-19) repro : disque retiré · beat4 (19-30) disque ré-affiché + pointillé
  // beat5 (30-40) fix : disque retiré, logo au-dessus · beat6 propre
  let diskO=0, outO=0, labO=0;
  if(b.s===0)    diskO=0;
  if(b.s===5.5)  diskO=easeInOut(clamp01(local/0.52));
  if(b.s===10.5) diskO=1-easeInOut(clamp01(local/0.52));
  if(b.s===16.5){diskO=1; outO=easeOut(clamp01((local-0.5)/0.4)); labO=outO;}
  if(b.s===25){diskO=1-easeInOut(clamp01(local/0.52)); outO=1-easeInOut(clamp01(local/0.52)); labO=outO;}
  if(b.s===33.5) diskO=0;
  disk.style.opacity=diskO; dOut.style.opacity=outO; dLab.style.opacity=labO;
  // léger pop du logo quand il redevient visible (scale .94→1, ease-out)
  const logoVisible=(diskO<0.5)?1:0;
  if(b.s===10.5||b.s===25){
    const k=easeOut(clamp01((local-0.25)/0.45));
    logo.style.transform=`scale(${mix(.94,1,k)})`; logo.style.opacity=mix(.2,1,k);
  } else if(b.s===5.5||b.s===16.5){
    logo.style.opacity=mix(1,.2,easeInOut(clamp01(local/0.52))); logo.style.transform="scale(1)";
  } else { logo.style.opacity=logoVisible?1:0.2; }
  // respiration Ken Burns du beat 1 et 6 (linear, scale 1→1.03 sur 4s) — §9 loops linear
  if(b.s===0||b.s===33.5){
    const kb=1+0.03*((t%4)/4);
    $("emblem").style.transform=`scale(${kb})`;
  } else $("emblem").style.transform="scale(1)";

  /* — panneau code : frappe animée beats 4 et 5 — */
  const code=$("code");
  if(b.s===16.5)      typeInto(code,CODE_BAD,17.5,24.0,t);
  else if(b.s===25)   typeInto(code,CODE_FIX,26.0,32.5,t);
  else if(b.s===33.5){code.innerHTML=esc(CODE_FIX);lastText=null;}
  else if(t<16.5){code.innerHTML='<span class="cm">/* inspection du composant… */</span>'+(Math.floor(t*2)%2?'<span class="caret"></span>':'');lastText=null;}
};
window.seek(0);
</script>
</body>
</html>
