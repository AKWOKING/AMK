<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=540, initial-scale=1">
<title>POST-01 v4 — Avatar motion-comic 31 s (render source)</title>
<style>
/* AMK POST-01 v4 — motion-comic, 6 beats, rendu frame-par-frame via window.seek(t).
   Personnage = composites figés (1080×1920, approuvés King) ; seul le changement d'état
   et les textes bougent. Fondus 250 ms (§9 : 200–320 ms). Transform + opacity uniquement.
   Pas de zoom, pas de panoramique. Pas de nom de marque à l'écran. */
:root{
  --bg:#101814; --ink:#FFFFFF; --soft:#C9D6CF; --brand-bright:#12A87C;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:540px;height:960px;overflow:hidden;background:var(--bg);
  font-family:Helvetica,Arial,"Liberation Sans",sans-serif;color:var(--ink)}
.frame{position:absolute;left:0;top:0;width:540px;height:960px;overflow:hidden}

/* — couche personnage : composites 1080×1920 mis à l'échelle 0,5 — */
.stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform:scale(.5);transform-origin:0 0}
.stage img{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0}

/* — couche texte : coordonnées 540×960 css — */
.text{position:absolute;left:0;top:0;width:540px;height:960px;pointer-events:none}
.overlay{position:absolute;top:100px;left:36px;right:36px;font-size:46px;font-weight:800;
  line-height:1.12;letter-spacing:-.4px;opacity:0}
.hook{position:absolute;top:212px;left:36px;right:36px;font-size:36px;font-weight:700;
  color:var(--soft);opacity:0}
.caption{position:absolute;top:268px;left:36px;right:36px;font-size:25px;line-height:1.3;
  font-weight:600;color:var(--soft);opacity:0}

/* — progression (linéaire, §9) — */
.progress{position:absolute;left:0;right:0;bottom:0;height:8px;background:#23382E}
.progress i{display:block;height:100%;background:var(--brand-bright);transform-origin:0 50%;transform:scaleX(0)}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="stage" id="stage">
    <img id="s-idle"      src="../../Avatar/_composites/composite-idle.png"      alt="">
    <img id="s-talking"   src="../../Avatar/_composites/composite-talking.png"   alt="">
    <img id="s-thinking"  src="../../Avatar/_composites/composite-thinking.png"  alt="">
    <img id="s-surprised" src="../../Avatar/_composites/composite-surprised.png" alt="">
    <img id="s-pointing"  src="../../Avatar/_composites/composite-pointing.png"  alt="">
    <img id="s-approving" src="../../Avatar/_composites/composite-approving.png" alt="">
  </div>
  <div class="text">
    <div class="overlay" id="overlay"></div>
    <div class="hook" id="hook"></div>
    <div class="caption" id="caption"></div>
  </div>
  <div class="progress"><i id="prog"></i></div>
</div>

<script>
/* Déterministe : tout est fonction de t. window.seek(t) pose l'état exact (contrat render.mjs). */
function bez(p1x,p1y,p2x,p2y){return function(t){
  let x=t;
  for(let i=0;i<6;i++){
    const cx=3*p1x*(1-x)*(1-x)*x+3*p2x*(1-x)*x*x+x*x*x - t;
    const dx=3*p1x*(1-2*x)*(1-x)+6*p2x*x*(1-x)-3*p2x*x*x+3*x*x + 1e-6;
    x-=cx/dx;
  }
  return 3*p1y*(1-x)*(1-x)*x+3*p2y*(1-x)*x*x+x*x*x;
};}
const easeOut=bez(.23,1,.32,1), easeInOut=bez(.77,0,.175,1);
const clamp01=v=>Math.max(0,Math.min(1,v));
const mix=(a,b,t)=>a+(b-a)*t;
const $=id=>document.getElementById(id);
const TOTAL=31, XF=0.25;

/* Changements d'état (composites). [instant, état]. Fondu 250 ms à partir de l'instant. */
const SWITCH=[[0,'idle'],[2.2,'surprised'],[3.2,'talking'],[7.0,'thinking'],
              [12.0,'surprised'],[15.0,'approving'],[21.0,'pointing'],[27.0,'approving']];
const IMG={idle:'s-idle',talking:'s-talking',thinking:'s-thinking',
           surprised:'s-surprised',pointing:'s-pointing',approving:'s-approving'};

/* Textes par intervalle [début, fin, texte]. Dernier intervalle inclusif jusqu'à TOTAL. */
const OV=[[0,2.2,'Le logo du site a disparu.'],[2.2,3.2,'Un nouveau logo.'],[3.2,7,"On l'intègre. Et là… rien."],
          [7,9,'On enlève le masque.'],[9,12,'Faux.'],[12,21,'Un disque invisible.'],
          [21,27,"Le fix : creuser l'anneau."],[27,31,"Le détail qu'on voit pas, c'est celui qui casse tout."]];
const HOOK=[[1,3.2,'Tu vois pourquoi ?']];
const CAP=[[3.2,7,'2 jours bloqué sur ça.'],[7,12,"C'est pas le rognage."],
           [12,21,"L'anneau était un disque plein. Peint par-dessus."],[21,27,'Un vrai anneau. Logo au-dessus.']];

function pick(list,t){
  for(const [a,b,txt] of list){ if(t>=a && (t<b || b>=TOTAL)) return {txt,start:a}; }
  return null;
}
function setText(el,item,t){
  if(!item){ el.style.opacity=0; return; }
  if(el.dataset.txt!==item.txt){ el.textContent=item.txt; el.dataset.txt=item.txt; }
  const k=easeOut(clamp01((t-item.start)/0.2));
  el.style.opacity=k; el.style.transform=`translateY(${mix(18,0,k)}px)`;
}
function stateAt(t){
  let idx=0; for(let i=0;i<SWITCH.length;i++) if(t>=SWITCH[i][0]) idx=i;
  const to=SWITCH[idx][1];
  const from= idx>0 ? SWITCH[idx-1][1] : null;
  const k = idx===0 ? 1 : easeInOut(clamp01((t-SWITCH[idx][0])/XF));
  return {from,to,k};
}

window.seek=function(t){
  t=Math.max(0,Math.min(TOTAL,t));
  /* — personnage : fondu enchaîné entre composites — */
  const {from,to,k}=stateAt(t);
  for(const key of Object.keys(IMG)){
    const el=$(IMG[key]); let op=0, z=0;
    if(key===to){ op=k; z=2; }
    else if(key===from && k<1){ op=1; z=1; }
    el.style.opacity=op; el.style.zIndex=z;
  }
  /* — textes — */
  setText($('overlay'), pick(OV,t), t);
  setText($('hook'), pick(HOOK,t), t);
  setText($('caption'), pick(CAP,t), t);
  /* — progression — */
  $('prog').style.transform=`scaleX(${t/TOTAL})`;
};
window.seek(0);
</script>
</body>
</html>
