<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;background:#0F172A;font-family:Arial,Helvetica,sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.16),transparent 65%);top:-260px;right:-260px}
.glow2{position:absolute;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.10),transparent 65%);bottom:-200px;left:-240px}
.mid{position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);text-align:center;width:100%;padding:0 60px}
.logo{width:210px;height:210px;border-radius:44px;margin:0 auto 40px}
.brand{color:#fff;font-size:44px;font-weight:700;letter-spacing:.5px}
.brand span{color:#F59E0B}
.sub{color:#94A3B8;font-size:26px;margin-top:10px}
.rule{width:120px;height:5px;background:#F59E0B;margin:44px auto;border-radius:99px}
.big{color:#fff;font-size:74px;font-weight:800;line-height:1.15;letter-spacing:-1px}
.big em{color:#F59E0B;font-style:normal}
.cta{margin-top:48px;background:#F59E0B;color:#0F172A;font-size:40px;font-weight:800;padding:26px 54px;border-radius:99px;display:inline-block}
.phone{color:#CBD5E1;font-size:30px;margin-top:36px}
.foot{position:absolute;bottom:60px;width:100%;text-align:center;color:#64748B;font-size:22px}
.avatar{position:absolute;right:-30px;bottom:280px;width:430px;transform:rotate(-4deg)}
</style></head><body>
<div class="glow"></div><div class="glow2"></div>
<div class="mid">
 <img class="logo" src="../../brand/AMK-logo-square.png">
 <div class="brand">AMK — <span>Web Development</span></div>
 <div class="sub">& Digital Solutions · Douala · Yaoundé · Buea · Limbe</div>
 <div class="rule"></div>
 <div class="big">Aperçu gratuit<br><em>en 24 heures</em></div>
 <div class="cta">Écrivez APERÇU sur WhatsApp</div>
 <div class="phone">+237 677 789 631</div>
</div>
<img class="avatar" src="../../brand/avatar-amk.png">
<div class="foot">Concept by AMK · Bilingue EN|FR · Mobile-first</div>
</body></html>
