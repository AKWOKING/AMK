/* Layout: phone-first single column, summary on top, bottom tab bar; invoice paper stays white in both themes. */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --fg:#0F172A; --muted:#5A6579; --line:#DCE2EC;
  --accent:#B45309; --fill:#F59E0B; --on-fill:#0F172A; --navy:#0F172A; --shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);
  --ok:#166534; --ok-bg:#DCFCE7; --warn:#92400E; --warn-bg:#FEF3C7; --bad:#991B1B; --bad-bg:#FEE2E2; --info:#1E3A8A; --info-bg:#DBEAFE;
  --paper:#FFFFFF; --ink:#0F172A; --ink-soft:#56627A; --ink-line:#DCE2EC; --ink-accent:#B45309;
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1120; --surface:#121B2E; --fg:#EDF1F8; --muted:#9AA6BB; --line:#24304B;
  --accent:#FBBF24; --shadow:none;
  --ok:#86EFAC; --ok-bg:#12331F; --warn:#FCD34D; --warn-bg:#3A2A0A; --bad:#FCA5A5; --bad-bg:#3B1515; --info:#93C5FD; --info-bg:#14264A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1120; --surface:#121B2E; --fg:#EDF1F8; --muted:#9AA6BB; --line:#24304B;
  --accent:#FBBF24; --shadow:none;
  --ok:#86EFAC; --ok-bg:#12331F; --warn:#FCD34D; --warn-bg:#3A2A0A; --bad:#FCA5A5; --bad-bg:#3B1515; --info:#93C5FD; --info-bg:#14264A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px;margin:0}
.wrap{max-width:720px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0}
.top svg{width:34px;height:34px;border-radius:8px;flex:none}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.01em;line-height:1.1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.top .sp{flex:1}
.langbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;letter-spacing:.04em}
h1.h1{font-family:var(--f-display);font-size:26px;line-height:1.15;margin:14px 0 14px;text-wrap:balance}
h2.h2{font-family:var(--f-display);font-size:17px;margin:22px 0 10px}
.muted{color:var(--muted)}
.sum{background:var(--navy);color:#F8FAFC;border-radius:14px;padding:18px;display:grid;gap:4px;margin-top:4px}
.sum .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#CBD5E1}
.sum .big{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums;color:#FCD34D}
.sum .sub{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:#CBD5E1;margin-top:6px}
.sum .sub b{color:#F8FAFC;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;margin:16px 0 10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list{display:grid;gap:8px}
.inv{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.inv .n{font-weight:600}
.inv .c{color:var(--muted);font-size:14px;min-width:0;overflow-wrap:anywhere}
.inv .a{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.inv .r{text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;margin-left:6px;vertical-align:1px}
.pill.paid{background:var(--ok-bg);color:var(--ok)}.pill.partial{background:var(--info-bg);color:var(--info)}
.pill.unpaid{background:var(--warn-bg);color:var(--warn)}.pill.overdue{background:var(--bad-bg);color:var(--bad)}
.sum .sub.late{color:var(--bad);font-weight:600}
.empty{border:1px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.form{display:grid;gap:6px}
.form label{font-size:13px;font-weight:600;color:var(--muted);margin-top:8px}
.form label:first-child{margin-top:0}
input,select,textarea{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--fill);border-color:var(--fill);color:var(--on-fill)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent;white-space:nowrap}
.btn.sm{padding:7px 11px;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px;background:var(--bg)}
.item .line{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.tot{display:grid;gap:4px;margin-top:10px;font-variant-numeric:tabular-nums}
.tot div{display:flex;justify-content:space-between;gap:12px}
.tot .grand{font-weight:700;font-size:17px;border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:720px}
.tab{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 4px;border-radius:10px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab.new{color:var(--on-fill)}
.tab.new span.ic{background:var(--fill);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;margin-top:-14px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.tab.new{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:20;max-width:90vw}
.sheet{position:fixed;inset:0;background:rgba(10,17,32,.6);z-index:30;display:grid;align-items:end;padding:0}
.sheet .box{background:var(--surface);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-height:80vh;overflow:auto;display:grid;gap:10px}
.sheet textarea{min-height:160px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
/* invoice paper */
.paperbox{overflow-x:auto}
.paper{background:var(--paper);color:var(--ink);border-radius:6px;box-shadow:0 2px 18px rgba(0,0,0,.18);padding:24px;font-size:13px;position:relative;min-width:300px}
.paper .hd{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.paper .logo{display:flex;gap:10px;align-items:center}
.paper .logo svg{width:44px;height:44px;border-radius:9px}
.paper .logo b{font-family:var(--f-display);font-size:22px;letter-spacing:.02em;display:block;line-height:1}
.paper .logo span{color:var(--ink-soft);font-size:12px}
.paper .ttl{text-align:right}
.paper .ttl h3{margin:0;font-family:var(--f-display);font-size:26px;letter-spacing:.06em;color:var(--ink)}
.paper .ttl div{color:var(--ink-soft)}
.paper .ttl .no{color:var(--ink);font-weight:600;font-size:14px}
.paper .bar{height:3px;background:#F59E0B;margin:16px 0}
.paper .parties{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:460px){.paper .parties{grid-template-columns:1fr}}
.paper h4{margin:0 0 4px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.paper table{width:100%;border-collapse:collapse;margin-top:18px}
.paper th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);text-align:left;border-bottom:2px solid var(--ink);padding:6px 4px}
.paper td{padding:8px 4px;border-bottom:1px solid var(--ink-line);vertical-align:top}
.paper .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.paper .totals{margin:14px 0 0 auto;width:min(100%,300px);display:grid;gap:4px;font-variant-numeric:tabular-nums}
.paper .totals div{display:flex;justify-content:space-between;gap:12px}
.paper .totals .gt{font-weight:700;font-size:15px;border-top:2px solid var(--ink);padding-top:6px;margin-top:2px}
.paper .totals .due{background:#0F172A;color:#FCD34D;padding:8px 10px;border-radius:6px;font-weight:700;font-size:15px;margin-top:6px}
.paper .pay{margin-top:20px;border-top:1px solid var(--ink-line);padding-top:12px;display:grid;gap:3px}
.paper .note{margin-top:12px;color:var(--ink-soft);white-space:pre-wrap}
.paper .sign{margin-top:22px;display:flex;justify-content:flex-end}
.paper .sign .box{width:min(100%,240px);height:96px;border:1px dashed var(--ink-line);border-radius:6px;padding:6px 10px;color:var(--ink-soft);font-size:12px}
.paper .foot{margin-top:18px;color:var(--ink-soft);font-size:12px;text-align:center}
.paper .stamp{position:absolute;right:24px;top:96px;border:3px solid #166534;color:#166534;border-radius:8px;padding:2px 12px;font-family:var(--f-display);font-weight:700;letter-spacing:.12em;transform:rotate(-8deg);font-size:20px}
.pays{display:grid;gap:6px;margin-top:6px}
.pays .p{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
@media print{
  body{background:#fff;padding:0}
  .top,.tabs,.noprint,.toast,.sheet,h1.h1{display:none!important}
  .paper{box-shadow:none;border-radius:0;padding:0;font-size:11.5pt}
  .paperbox{overflow:visible}
  @page{size:A4;margin:14mm}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

function migrate(d) {
  const st = d.settings;
  if (st.niu === 'P0302') st.niu = DEFAULT_SETTINGS.niu;
  Object.keys(DEFAULT_SETTINGS).forEach(k => { if (st[k] === undefined) st[k] = DEFAULT_SETTINGS[k]; });
  if (st.tag === 'Création de sites web') st.tag = DEFAULT_SETTINGS.tag;
  if (st.phone === '+237 677 789 631') st.phone = DEFAULT_SETTINGS.phone;
  d.clients.forEach(c => { if (c.name === 'DM optique SARL') Object.assign(c, DM, { id:c.id }); if (c.contact === undefined) c.contact = ''; });
  d.services = d.services || {};
  d.invoices.forEach(i => {
    if (!i.docType) i.docType = 'invoice';
    if (i.items.length === 1 && i.items[0].desc === 'Création de site web' && num(i.items[0].price) === 150000) { i.items = JSON.parse(JSON.stringify(DM_ITEMS)); if (!i.notes) i.notes = DM_NOTE; }
    i.payments.forEach(p => { if (p.method === 'other' && num(p.amount) === 75000 && p.date === i.date) { p.method = 'cash'; p.date = i.date.slice(0, 4) + '-10-13'; } });
  });
  return d;
}

}

const calc = inv => {
  const sub = (inv.items || []).reduce((s, i) => s + num(i.qty) * num(i.price), 0);
  const disc = Math.min(Math.max(num(inv.discount), 0), sub);
  const total = sub - disc;
  const paid = (inv.payments || []).reduce((s, p) => s + num(p.amount), 0);
  return { sub, disc, total, paid, bal: Math.max(total - paid, 0) };
};
const statusOf = inv => {
  const c = calc(inv);
  if (c.total > 0 && c.bal === 0) return 'paid';
  if (inv.due && inv.due < todayISO()) return 'overdue';
  return c.paid > 0 ? 'partial' : 'unpaid';
};
const lateDays = inv => {
  if (!inv.due || inv.due >= todayISO()) return 0;
  return Math.max(1, Math.round((new Date(todayISO() + 'T12:00:00') - new Date(inv.due + 'T12:00:00')) / 86400000));
};
const money = (n, lang) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ' + (lang === 'fr' ? 'FCFA' : 'XAF');
const fdate = (iso, lang) => iso ? new Date(iso + 'T12:00:00').toLocaleDateString(lang === 'fr' ? 'fr-FR' : 'en-GB', { day:'numeric', month:'long', year:'numeric' }) : '';
const clientOf = id => db.clients.find(c => c.id === id);
const invOf = id => db.invoices.find(i => i.id === id);
const nextNumber = (dateISO, docType) => {
  const y = (dateISO || todayISO()).slice(0, 4), p = (db.settings.prefix || 'INV') + (docType === 'proforma' ? '-PRO' : '');
  const re = new RegExp('^' + p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '-' + y + '-(\\d+)$');
  let max = 0; db.invoices.forEach(i => { const m = re.exec(i.number); if (m) max = Math.max(max, +m[1]); });
  return p + '-' + y + '-' + String(max + 1).padStart(3, '0');
};

function toast(msg) {
  const old = q('.toast'); if (old) old.remove();
  const el = document.createElement('div'); el.className = 'toast noprint'; el.textContent = msg; el.setAttribute('role', 'status');
  document.body.appendChild(el); setTimeout(() => el.remove(), 2200);
}
function sheet(title, text) {
  q('#layer').innerHTML = `<div class="sheet noprint" data-a="closeSheet"><div class="box" data-stop><b>${esc(title)}</b><textarea id="sheet-ta" readonly>${esc(text)}</textarea><button class="btn primary" data-a="closeSheet">${t('close')}</button></div></div>`;

}
function copyText(text, okMsg) {

}

const MSG_KINDS = [['dep', 'mDep'], ['bal', 'mBal'], ['rem', 'mRem'], ['mon', 'mMon']];
function suggestKind(inv) {

function msgFor(kind, inv) {

  const hi = greeting(inv, cl), pay = payLine(L), no = inv.number;

  const doc = inv.docType === 'proforma' ? (fr ? 'la facture proforma' : 'the proforma invoice') : (fr ? 'la facture' : 'the invoice');

      ? `Merci pour votre confiance. Comme convenu, voici ${doc} ${no}, en pièce jointe.\n\nTotal : ${m(c.total)}\nAcompte pour démarrer : ${m(half)}\nSolde à la livraison : ${m(c.total - half)}\n\nLe travail démarre dès que l'acompte est encaissé. Vous pouvez régler comme cela vous arrange :\n${pay}\n\nJe vous remets un reçu signé et tamponné à chaque paiement.`
      : `Thank you for your trust. As agreed, please find ${doc} ${no} attached.\n\nTotal: ${m(c.total)}\nDeposit to start: ${m(half)}\nBalance on delivery: ${m(c.total - half)}\n\nWork starts as soon as the deposit is received. You can pay whichever way suits you:\n${pay}\n\nI give you a signed and stamped receipt for every payment.`;
  } else if (kind === 'bal') {

      : `A friendly reminder: invoice ${no} (${m(c.bal)} remaining) was due on ${fdate(inv.due, L)}. It is attached.\n\nIf the payment has already been sent, just send me the proof and I will update everything. Otherwise:\n${pay}\n\nIf another date suits you better, or paying in two instalments, tell me and we will find a way together.`;

    doc.setDrawColor(...LINE); doc.setLineWidth(0.6); doc.line(M, y, W - M, y); y += 16;
    T(M, y, X('payTo').toUpperCase(), { b:1, sz:7.5, col:SOFT }); y += 14;
    [[st.momo ? 'MTN MoMo : ' + st.momo : '', 1], [st.om ? 'Orange Money : ' + st.om : '', 1], [st.bank ? st.bank + ' - ' + X('accountL') + ' ' + st.acc : '', 0], [st.bank ? X('holderL') + ' : ' + st.holder : '', 0]].filter(r => r[0]).forEach(r => { T(M, y, r[0], { b:r[1], sz:9.5 }); y += 13; });
    y += 6;
    if (inv.notes) wrap(inv.notes, W - 2 * M, 9).forEach(ln => { T(M, y, ln, { sz:9, col:SOFT }); y += 12; });
    if (y + 80 > H - M) { foot(); doc.addPage(); y = M; }
    signBox(y + 8); foot();
    if (c.total > 0 && c.bal === 0) T(W - M - 20, 150, X('paidStamp'), { b:1, sz:20, col:GREEN, al:'right', angle:8 });
  }
  const slug = String(cl.name).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toUpperCase();
  const name = (isReceipt ? 'Recu-' + rc.no : (inv.docType === 'proforma' ? 'Proforma-' : 'Facture-') + inv.number) + '-' + slug + '.pdf';
  return { doc, name, text:isReceipt ? receiptText(inv, payId) : invText(inv) };
}
function waFallback(inv, payId, msg) {
  const cl = clientOf(inv.clientId), txt = msg || (payId ? receiptText(inv, payId) : invText(inv));
  window.open('https://wa.me/' + waNumber(cl && cl.phone) + '?text=' + encodeURIComponent(txt), '_blank', 'noopener');
}
async function doShare(inv, payId, msg) {
  let pdf;
  try { pdf = buildPdf(inv, payId); } catch (e) { toast(t('pdfFail')); waFallback(inv, payId, msg); return; }
  toast(t('pdfMake'));
  const blob = pdf.doc.output('blob');
  try {
    const file = new File([blob], pdf.name, { type:'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title:pdf.name, text:msg || pdf.text }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  if (IS_PWA) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = pdf.name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); toast(t('pdfSaved')); return;
  }
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename:pdf.name, data:blob }); return; }
  } catch (e) { if (e && e.code === 'declined') return; }
  toast(t('pdfFail')); waFallback(inv, payId, msg);
}

/* ---------- events ---------- */
const actions = {
  tab(el) {
    const k = el.dataset.k;
    if (k === 'new') { state.draft = newDraft(); go('edit'); } else go(k);
  },
  toggleLang() { db.settings.lang = db.settings.lang === 'fr' ? 'en' : 'fr'; persist(); render(); },
  filter(el) { state.filter = el.dataset.k; render(); },
  open(el) { go('view', el.dataset.id); },
  closeSheet(el, e) { if (e.target === el || el.tagName === 'BUTTON') q('#layer').innerHTML = ''; },
  addItem() { state.draft.items.push({ desc:'', qty:1, price:'' }); render(); },
  rmItem(el) { state.draft.items.splice(+el.dataset.i, 1); render(); },
  newClientFromEdit() { state.returnTo = 'edit'; state.clientBack = state.draft; state.draft = { isNew:true, id:uid(), name:'', contact:'', phone:'', email:'', addr:'', niu:'' }; go('client'); },
  cancelEdit() { go(state.id && invOf(state.id) && !state.draft.isNew ? 'view' : 'list'); },
  saveInv() {
    const d = state.draft, err = q('#err');
    d.items = d.items.filter(i => String(i.desc).trim());
    if (!d.clientId) { err.textContent = t('errClient'); if (!d.items.length) d.items = [{ desc:'', qty:1, price:'' }]; return; }
    if (!d.items.length) { err.textContent = t('errItem'); d.items = [{ desc:'', qty:1, price:'' }]; render(); q('#err').textContent = t('errItem'); return; }
    const inv = { id:d.id, docType:d.docType || 'invoice', number:d.number.trim() || nextNumber(d.date, d.docType), date:d.date, due:d.due, clientId:d.clientId, lang:d.lang,
      items:d.items.map(i => ({ desc:String(i.desc).trim(), qty:num(i.qty) || 1, price:num(i.price) })), discount:num(d.discount), notes:d.notes, payments:d.payments || [] };
    if (d.isNew && num(d.deposit) > 0) inv.payments.push({ id:uid(), date:d.date, amount:num(d.deposit), method:'other' });
    inv.items.forEach(i => { db.services[i.desc] = i.price; });
    const at = db.invoices.findIndex(i => i.id === inv.id);
    if (at >= 0) db.invoices[at] = inv; else db.invoices.push(inv);
    persist(); toast(t('saved')); state.msgFor = null; go('view', inv.id);
  },
  editInv() { const inv = invOf(state.id); state.draft = JSON.parse(JSON.stringify(inv)); state.draft.isNew = false; state.draft.discount = inv.discount || ''; go('edit'); },
  delInv() { if (!state.confirmDel) { state.confirmDel = true; render(); return; } db.invoices = db.invoices.filter(i => i.id !== state.id); persist(); go('list'); },
  payForm() { state.payForm = !state.payForm; render(); },
  savePay() {
    const amt = num(q('#p-amt').value); if (amt <= 0) return;
    invOf(state.id).payments.push({ id:uid(), date:q('#p-date').value || todayISO(), amount:amt, method:q('#p-method').value });
    persist(); state.payForm = false; state.msgFor = null; render(); toast(t('saved'));
  },
  rmPay(el) { const inv = invOf(state.id); inv.payments = inv.payments.filter(p => p.id !== el.dataset.id); persist(); state.msgFor = null; render(); },
  wa() {
    const inv = invOf(state.id), cl = clientOf(inv.clientId);
    window.open('https://wa.me/' + waNumber(cl && cl.phone) + '?text=' + encodeURIComponent(invText(inv)), '_blank', 'noopener');
  },
  copyInv() { copyText(invText(invOf(state.id)), t('copied')); },
  print() { window.print(); },
  sharePdf() { const ta = q('#msg-ta'); doShare(invOf(state.id), null, ta ? ta.value : null); },
  msgKind(el) { state.msgKind = el.dataset.k; state.msgText = null; render(); },
  msgOnly() { const ta = q('#msg-ta'); waFallback(invOf(state.id), null, ta ? ta.value : null); },
  copyMsg() { const ta = q('#msg-ta'); copyText(ta ? ta.value : '', t('msgCopied')); },
  sharePdfReceipt() { doShare(invOf(state.id), state.payId); },
  receipt(el) { state.payId = el.dataset.id; go('receipt'); },
  backToInv() { go('view'); },
  copyReceipt() { copyText(receiptText(invOf(state.id), state.payId), t('rcpCopied')); },
  convert() { const inv = invOf(state.id); inv.docType = 'invoice'; inv.number = nextNumber(inv.date, 'invoice'); inv.date = todayISO(); inv.due = addDays(inv.date, db.settings.dueDays || 14); persist(); render(); toast(t('saved')); },
  addClient() { state.returnTo = null; state.draft = { isNew:true, id:uid(), name:'', contact:'', phone:'', email:'', addr:'', niu:'' }; go('client'); },
  editClient(el) { state.returnTo = null; state.draft = Object.assign({ isNew:false }, clientOf(el.dataset.id)); go('client'); },
  cancelClient() { if (state.returnTo === 'edit') { state.draft = state.clientBack; state.returnTo = null; go('edit'); } else go('clients'); },
  saveClient() {
    const c = state.draft; if (!c.name.trim()) { q('#err').textContent = t('errName'); return; }
    const rec = { id:c.id, name:c.name.trim(), contact:(c.contact || '').trim(), phone:c.phone.trim(), email:c.email.trim(), addr:c.addr.trim(), niu:c.niu.trim() };
    const at = db.clients.findIndex(x => x.id === rec.id); if (at >= 0) db.clients[at] = rec; else db.clients.push(rec);
    persist();
    if (state.returnTo === 'edit') { state.draft = state.clientBack; state.draft.clientId = rec.id; state.returnTo = null; go('edit'); } else go('clients');
  },
  delClient() {
    const c = state.draft;
    if (db.invoices.some(i => i.clientId === c.id)) { q('#err').textContent = t('cHas'); return; }
    if (!state.confirmDel) { state.confirmDel = true; render(); return; }
    db.clients = db.clients.filter(x => x.id !== c.id); persist(); go('clients');
  },
  copyBackup() { copyText(JSON.stringify(db), t('copied')); },
  saveBackupFile() {
    const blob = new Blob([JSON.stringify(db)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'amk-factures-' + todayISO() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  },
  restore() {
    try { const d = JSON.parse(q('#restore-ta').value); if (!d || !Array.isArray(d.invoices) || !Array.isArray(d.clients) || !d.settings) throw 0; d.services = d.services || {}; db = d; persist(); render(); toast(t('restored')); }
    catch (e) { toast(t('badBackup')); }
  }
};
document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]') && !e.target.closest('button')) return;
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = actions[el.dataset.a]; if (fn) fn(el, e);
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f) { state.draft[el.dataset.f] = el.value; if (['discount','deposit'].includes(el.dataset.f)) updateTotals(); }
  else if (el.dataset.i !== undefined) { state.draft.items[+el.dataset.i][el.dataset.k] = el.value; updateTotals(); }
  else if (el.id === 'msg-ta') state.msgText = el.value;
  else if (el.dataset.cf) state.draft[el.dataset.cf] = el.value;
  else if (el.dataset.sf) { const k = el.dataset.sf; db.settings[k] = k === 'dueDays' ? (parseInt(el.value, 10) || 0) : el.value; persist(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.f === 'lang') { state.draft.lang = el.value; updateTotals(); }
  if (el.dataset.f === 'date') { state.draft.due = addDays(el.value || todayISO(), db.settings.dueDays || 14); if (state.draft.isNew) state.draft.number = nextNumber(el.value, state.draft.docType); render(); }
  if (el.dataset.f === 'docType') { state.draft.docType = el.value; if (state.draft.isNew) state.draft.number = nextNumber(state.draft.date, el.value); render(); }
  if (el.dataset.sf === 'lang') render();
  if (el.dataset.k === 'desc' && db.services[el.value] !== undefined) {
    const it = state.draft.items[+el.dataset.i]; if (!num(it.price)) { it.price = db.services[el.value]; render(); }
  }
});
render();
if (IS_PWA && 'serviceWorker' in navigator && location.protocol.startsWith('http')) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
</script>
