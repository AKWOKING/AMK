# Modèle — à coller dans .github/workflows/deploy-dmoptic.yml (branche : main)
#
# Pourquoi un modèle hors de .github/workflows ?
# L'outil qui pousse ce dépôt n'a pas le droit de déposer un fichier de workflow
# (GitHub réserve ça aux comptes humains, pour empêcher un script de modifier la
# chaîne de publication). Le fichier est donc versionné ici, prêt à copier :
# GitHub → Add file → Create new file → branche « main » → coller → Commit.
#
# Ce qu'il fait : à chaque envoi sur une branche `arena/…`, Cloudflare reçoit le
# dossier hosting/previews/dmoptic. Aucun réglage de branche à changer dans le
# tableau de bord quand une nouvelle conversation ouvre une nouvelle branche.

name: Déployer DM Optique sur Cloudflare

on:
  push:
    branches:
      - "arena/**"          # toutes les branches de conversation, présentes et futures
      - "main"
    paths:
      - "hosting/previews/dmoptic/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-dmoptic.yml"
  workflow_dispatch: {}      # bouton « Run workflow » pour publier à la demande

permissions:
  contents: read

concurrency:
  group: deploy-dmoptic
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Garde-fou : on ne publie pas un site vide ou amputé de ses fichiers clés.
      - name: Vérifier le site avant publication
        run: |
          set -e
          test -f hosting/previews/dmoptic/index.html   || { echo "index.html manquant"; exit 1; }
          test -f hosting/previews/dmoptic/sitemap.xml  || { echo "sitemap.xml manquant"; exit 1; }
          # Pas de test sur _redirects : ce fichier n'existe plus (Workers n'accepte que des
          # chemins relatifs, et une redirection d'hôte ne s'y écrit pas — voir wrangler.toml).
          test -f hosting/previews/dmoptic/_headers     || { echo "_headers manquant"; exit 1; }
          test -f wrangler.toml                         || { echo "wrangler.toml manquant"; exit 1; }
          n=$(find hosting/previews/dmoptic -type f | wc -l)
          echo "fichiers à publier : $n"
          test "$n" -gt 100 || { echo "seulement $n fichiers : publication bloquée"; exit 1; }

      - name: Publier sur Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
