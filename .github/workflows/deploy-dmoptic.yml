name: Déployer DM Optique sur Cloudflare

# Pourquoi ce fichier existe
# --------------------------
# Le tableau de bord Cloudflare (« Upload static files to update your Worker »)
# bloque sur un site de 183 fichiers / 9 Mo, et il n'affiche ni erreur ni
# progression. Le chemin fiable, pour un site statique, c'est l'envoi direct
# depuis le dépôt : à chaque fusion dans main, Cloudflare reçoit le dossier
# hosting/previews/dmoptic — sans zip, sans glisser-déposer, sans navigateur.
#
# Mise en place (une fois, 5 minutes) : voir
#   clients/dm-optic/launch/DEPLOIEMENT-CLOUDFLARE-2026-10-22.md

on:
  push:
    branches: [main]
    paths:
      - "hosting/previews/dmoptic/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-dmoptic.yml"
  workflow_dispatch: {}      # bouton « Run workflow » pour publier à la demande

permissions:
  contents: read

concurrency:
  group: deploy-dmoptic
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Garde-fou : si le dossier a été vidé ou si le fichier de redirection a
      # disparu, on s'arrête AVANT de publier un site cassé.
      - name: Vérifier le site avant publication
        run: |
          set -e
          test -f hosting/previews/dmoptic/index.html || { echo "index.html manquant"; exit 1; }
          test -f hosting/previews/dmoptic/sitemap.xml || { echo "sitemap.xml manquant"; exit 1; }
          test -f hosting/previews/dmoptic/_redirects || { echo "_redirects manquant"; exit 1; }
          n=$(find hosting/previews/dmoptic -type f | wc -l)
          echo "fichiers : $n"
          test "$n" -gt 100 || { echo "seulement $n fichiers : déploiement bloqué"; exit 1; }

      - name: Publier sur Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
