<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Médecine ophtalmologique au Cameroun — consultations à Mbouda, Bafoussam, Douala et Bonabéri</title>
    <meta
      name="description"
      content="Site professionnel d’un médecin ophtalmologue itinérant au Cameroun : lieux et jours de consultation, demande de rendez-vous par WhatsApp ou téléphone."
    />
    <!-- Aperçu privé : le site ne doit pas être indexé tant que le médecin ne l'a pas validé et publié. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#07111d" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_CM" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:title" content="Votre vision, ma priorité — médecine ophtalmologique au Cameroun" />
    <meta
      property="og:description"
      content="Un médecin ophtalmologue, plusieurs lieux de consultation : Mbouda, Bafoussam, Douala et Bonabéri. Jours de consultation et demande de rendez-vous."
    />
    <!-- Remplacer par l'URL absolue du domaine une fois publié (les réseaux sociaux l'exigent) -->
    <!-- JPEG 1200 × 630 et non WebP : l'aperçu de partage doit s'afficher dans WhatsApp -->
    <meta property="og:image" content="assets/img/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Médecine ophtalmologique au Cameroun : consultations à Mbouda, Bafoussam, Douala et Bonabéri." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="assets/fonts/inter-tight-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/newsreader-latin-300-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script type="module" src="js/app.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#hero" data-i18n="common.skip">Aller au contenu</a>

    <!-- ══ EN-TÊTE ══════════════════════════════════════════════════════════ -->
    <header class="site-header" data-header>
      <div class="header-inner">
        <a class="wordmark" href="#hero" aria-label="Accueil" data-i18n-aria="nav.home">
          <span class="wordmark-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="22" height="22" fill="none" stroke="currentColor">
              <path d="M2 16c4.5-7 10.5-10 14-10s9.5 3 14 10c-4.5 7-10.5 10-14 10S6.5 23 2 16Z" />
              <circle cx="16" cy="16" r="5.2" />
              <path d="M16 10.8a5.2 5.2 0 0 1 0 10.4" stroke-linecap="round" stroke-dasharray="2 3" />
            </svg>
          </span>
          <span class="wordmark-text">
            <span class="wordmark-title" data-i18n="common.brand">Médecine ophtalmologique</span>
            <span class="wordmark-sub" data-i18n="common.brandSub">Cameroun</span>
          </span>
        </a>

        <nav class="primary-nav" id="primary-nav" aria-label="Navigation principale" data-i18n-aria="nav.label">
          <ul class="nav-list">
            <li><a href="#hero" data-i18n="nav.home">Accueil</a></li>
            <li><a href="#parcours" data-i18n="nav.doctor">Le médecin</a></li>
            <li><a href="#consultations" data-i18n="nav.consultations">Consultations</a></li>
            <li><a href="#appointments" data-i18n="nav.appointments">Rendez-vous</a></li>
          </ul>
        </nav>

        <div class="header-tools">
          <div class="lang-switch" role="group" aria-label="Langue" data-i18n-aria="common.language">
            <button type="button" class="lang-btn" data-lang="fr" lang="fr" aria-pressed="true" aria-label="Français">FR</button>
            <span class="lang-sep" aria-hidden="true">/</span>
            <button type="button" class="lang-btn" data-lang="en" lang="en" aria-pressed="false" aria-label="English">EN</button>
          </div>
          <button
            type="button"
            class="nav-toggle"
            aria-expanded="false"
            aria-controls="primary-nav"
            data-nav-toggle
          >
            <span class="nav-toggle-bars" aria-hidden="true"></span>
            <span class="visually-hidden" data-i18n="common.menu">Menu</span>
          </button>
        </div>
      </div>
    </header>

    <main id="main">
      <!-- ══ 1 · HERO ══════════════════════════════════════════════════════ -->
      <section class="hero" id="hero" aria-labelledby="hero-title">
        <div class="hero-grid grid">
          <div class="hero-copy">
            <p class="eyebrow" data-i18n="hero.eyebrow">MÉDECINE OPHTALMOLOGIQUE · CAMEROUN</p>
            <h1 class="hero-title" id="hero-title" data-hero-title>
              <span>VOTRE</span><span>VISION,</span><span>MA PRIORITÉ.</span>
            </h1>
            <p class="hero-lead" data-i18n="hero.lead"></p>
            <div class="hero-actions">
              <a class="btn btn--primary" href="#consultations" data-i18n="hero.ctaPrimary"></a>
              <a class="btn btn--ghost" href="#parcours" data-i18n="hero.ctaSecondary"></a>
            </div>
            <div class="hero-places">
              <p class="hero-places-label" data-i18n="hero.placesLabel"></p>
              <p class="hero-places-line" data-i18n="hero.places"></p>
              <p class="hero-places-note" data-i18n="hero.placesNote"></p>
            </div>
          </div>

          <figure class="hero-figure">
            <div class="hero-photo">
              <img
                data-portrait
                src="assets/img/portrait-960.webp"
                srcset=""
                sizes="(min-width: 1000px) 42vw, 92vw"
                alt=""
                width="1376"
                height="768"
                fetchpriority="high"
                decoding="async"
              />
              <span class="hero-photo-frame" aria-hidden="true"></span>
            </div>
            <figcaption class="caption" data-portrait-caption></figcaption>
          </figure>
        </div>

        <div class="hero-strip">
          <p class="status-dot" data-hero-status></p>
        </div>
      </section>

      <!-- ══ 2 · PARCOURS ══════════════════════════════════════════════════ -->
      <section class="parcours" id="parcours" aria-labelledby="parcours-title">
        <div class="grid parcours-grid">
          <div class="parcours-text">
            <p class="kicker" data-i18n="parcours.kicker">À PROPOS DU MÉDECIN</p>
            <h2 class="section-title" id="parcours-title" data-i18n="parcours.title"></h2>
            <p class="lede" data-i18n="parcours.p1"></p>
            <p class="lede" data-i18n="parcours.p2"></p>

            <figure class="parcours-figure">
              <picture>
                <source
                  type="image/webp"
                  srcset="
                    assets/img/examination-640.webp  640w,
                    assets/img/examination-960.webp  960w,
                    assets/img/examination-1440.webp 1440w
                  "
                  sizes="(min-width: 1000px) 54vw, 92vw"
                />
                <img
                  src="assets/img/examination-960.webp"
                  alt="Examen de la vue : une praticienne examine l’œil d’une patiente à la lampe à fente, dans une salle de consultation claire."
                  width="1376"
                  height="768"
                  loading="lazy"
                  decoding="async"
                />
              </picture>
              <figcaption class="caption" data-i18n="parcours.examinationCaption"></figcaption>
            </figure>
          </div>

          <aside class="profile-card" aria-labelledby="profile-title">
            <div class="profile-head">
              <h3 class="profile-title" id="profile-title" data-i18n="parcours.profileTitle"></h3>
              <p class="profile-note" data-i18n="parcours.profileNote"></p>
            </div>
            <dl class="profile-list" data-profile-list></dl>
            <div class="profile-services">
              <h4 class="profile-subtitle" data-i18n="parcours.labels.services"></h4>
              <ul class="service-list" data-service-list></ul>
              <p class="service-note" data-service-note></p>
            </div>
          </aside>
        </div>

        <figure class="band-figure">
          <picture>
            <source
              type="image/webp"
              srcset="
                assets/img/equipment-640.webp  640w,
                assets/img/equipment-960.webp  960w,
                assets/img/equipment-1440.webp 1440w
              "
              sizes="92vw"
            />
            <img
              src="assets/img/equipment-960.webp"
              alt="Lampe à fente et fauteuil d’examen ophtalmologique dans une salle de consultation contemporaine."
              width="1376"
              height="768"
              loading="lazy"
              decoding="async"
            />
          </picture>
          <figcaption class="caption" data-i18n="parcours.equipmentCaption"></figcaption>
        </figure>
      </section>

      <!-- ══ 3 · CONSULTATIONS (et Rendez-vous à l'intérieur) ═════════════ -->
      <section class="consultations" id="consultations" aria-labelledby="consultations-title">
        <div class="grid consultations-intro">
          <div class="consultations-heading">
            <p class="kicker kicker--ice" data-i18n="consultations.kicker">
              LIEUX ET JOURS DE CONSULTATION
            </p>
            <h2 class="section-title section-title--light" id="consultations-title" data-i18n="consultations.title"></h2>
          </div>
          <p class="lede lede--light" data-i18n="consultations.lead"></p>
        </div>

        <div class="grid locations-grid">
          <fieldset class="location-picker">
            <legend class="picker-legend" data-i18n="consultations.selectLabel"></legend>
            <div class="picker-list" data-location-picker></div>
          </fieldset>
          <div class="location-detail" data-location-detail aria-live="polite"></div>
        </div>

        <!-- Les jours : panneau clair, parce qu'il se lit comme un horaire -->
        <div class="panel panel--schedule">
          <div class="panel-head">
            <div>
              <h3 class="panel-title" data-i18n="consultations.scheduleTitle"></h3>
            </div>
            <p class="panel-lead" data-i18n="consultations.scheduleLead"></p>
          </div>
          <div class="schedule" data-schedule></div>
          <p class="panel-note" data-schedule-note></p>
        </div>

        <!-- Rendez-vous : ancre #appointments DANS Consultations -->
        <div class="appointments-wrap" id="appointments">
          <div class="grid appointments-grid">
            <div class="appointments-text">
              <p class="kicker kicker--ice" data-i18n="appointment.kicker">RENDEZ-VOUS</p>
              <h2 class="section-title section-title--light" data-i18n="appointment.title"></h2>
              <p class="lede lede--light" data-i18n="appointment.lead"></p>
              <p class="notice notice--light">
                <span class="notice-icon" aria-hidden="true">i</span>
                <span data-i18n="appointment.liveNote"></span>
              </p>
            </div>

            <div class="appointment-card">
              <h3 class="card-title" data-i18n="appointment.formTitle"></h3>
              <p class="card-note" data-i18n="appointment.formNote"></p>

              <form class="appointment-form" novalidate data-form>
                <div class="field">
                  <label for="fullName" data-i18n="appointment.labels.fullName"></label>
                  <input
                    id="fullName"
                    name="fullName"
                    type="text"
                    autocomplete="name"
                    maxlength="80"
                    aria-describedby="fullName-error"
                    data-field="fullName"
                  />
                  <p class="field-error" id="fullName-error" data-error="fullName"></p>
                </div>

                <fieldset class="field field--radio">
                  <legend data-i18n="appointment.labels.contactMethod"></legend>
                  <div class="radio-row" data-contact-methods></div>
                </fieldset>

                <div class="field">
                  <label for="contact" data-contact-label data-i18n="appointment.labels.contactPhone"></label>
                  <input
                    id="contact"
                    name="contact"
                    type="text"
                    inputmode="tel"
                    autocomplete="tel"
                    maxlength="120"
                    aria-describedby="contact-hint contact-error"
                    data-field="contact"
                  />
                  <p class="field-hint" id="contact-hint" data-i18n="appointment.hints.contact"></p>
                  <p class="field-error" id="contact-error" data-error="contact"></p>
                </div>

                <div class="field">
                  <label for="locationId" data-i18n="appointment.labels.locationId"></label>
                  <select id="locationId" name="locationId" data-field="locationId" data-location-select>
                    <option value="" data-i18n="appointment.placeholders.choose"></option>
                  </select>
                  <p class="field-error" data-error="locationId"></p>
                </div>

                <div class="field-row">
                  <div class="field">
                    <label for="preferredDate" data-i18n="appointment.labels.preferredDate"></label>
                    <input id="preferredDate" name="preferredDate" type="date" data-field="preferredDate" />
                    <p class="field-hint" data-i18n="appointment.hints.preferredDate"></p>
                    <p class="field-error" data-error="preferredDate"></p>
                  </div>
                  <div class="field">
                    <label for="preferredTime" data-i18n="appointment.labels.preferredTime"></label>
                    <input id="preferredTime" name="preferredTime" type="time" data-field="preferredTime" />
                    <p class="field-error" data-error="preferredTime"></p>
                  </div>
                </div>

                <div class="field">
                  <label for="note" data-i18n="appointment.labels.note"></label>
                  <textarea id="note" name="note" rows="3" maxlength="400" data-field="note"></textarea>
                  <p class="field-hint" data-i18n="appointment.hints.note"></p>
                  <p class="field-error" data-error="note"></p>
                </div>

                <p class="form-summary" data-form-summary role="alert" aria-live="assertive"></p>

                <div class="form-actions">
                  <button type="submit" class="btn btn--dark" data-submit data-i18n="appointment.submit"></button>
                  <button type="button" class="btn btn--quiet" data-reset data-i18n="appointment.reset"></button>
                </div>
              </form>

              <div class="result" data-result hidden>
                <h4 class="result-title" data-result-title></h4>
                <p class="result-note" data-result-note></p>
                <pre class="result-message" data-result-message></pre>
                <div class="result-actions">
                  <a class="btn btn--primary" data-result-whatsapp hidden data-i18n="appointment.whatsapp"></a>
                  <button type="button" class="btn btn--ghost" data-copy data-i18n="appointment.copy"></button>
                </div>
                <p class="result-warning" data-i18n="appointment.disclaimer"></p>
              </div>

              <p class="card-footnote" data-i18n="appointment.disclaimer"></p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- ══ PIED ═══════════════════════════════════════════════════════════ -->
    <footer class="site-footer">
      <div class="grid footer-grid">
        <div class="footer-block footer-block--brand">
          <p class="footer-title" data-i18n="footer.title"></p>
          <p class="footer-line" data-i18n="footer.line"></p>
          <p class="footer-line footer-line--muted" data-i18n="footer.imagesLine"></p>
        </div>
        <nav class="footer-block" aria-labelledby="footer-consultations">
          <h2 class="footer-heading" id="footer-consultations" data-i18n="footer.consultations"></h2>
          <ul class="footer-list" data-footer-locations></ul>
        </nav>
        <div class="footer-block">
          <h2 class="footer-heading" data-i18n="footer.contact"></h2>
          <div class="footer-contact" data-footer-contact></div>
        </div>
        <div class="footer-block">
          <h2 class="footer-heading" data-i18n="footer.legal"></h2>
          <p class="footer-line footer-line--muted" data-i18n="footer.legalLine"></p>
          <button type="button" class="link-button" data-open-info data-i18n="footer.editLink"></button>
        </div>
      </div>
      <div class="footer-strip">
        <p class="footer-credit">
          <span class="credit-dot" aria-hidden="true"></span>
          <span data-i18n="footer.credit"></span>
        </p>
        <p data-footer-rights></p>
        <a href="#hero" class="footer-top" data-i18n="footer.backToTop"></a>
      </div>
    </footer>

    <dialog class="info-dialog" data-info-dialog aria-labelledby="info-title">
      <div class="info-inner">
        <h2 class="info-title" id="info-title" data-i18n="footer.editTitle"></h2>
        <p class="info-intro" data-i18n="footer.editIntro"></p>
        <div data-info-list></div>
        <p class="info-hint" data-i18n="footer.editHint"></p>
        <form method="dialog" class="info-actions">
          <button class="btn btn--dark" data-i18n="common.close"></button>
        </form>
      </div>
    </dialog>

    <p class="visually-hidden" role="status" aria-live="polite" data-live></p>
  </body>
</html>
